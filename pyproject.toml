[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "searchforge"
version = "0.1.0"
description = "SearchForge · 世界级神经/混合检索与学习重排系统（作者 晨星）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "rank_bm25==0.2.2",
    "faiss-cpu==1.15.1",
    "optuna==5.0.0",
]

[tool.setuptools.packages.find]
include = ["searchforge*"]

[tool.pytest.ini_options]
# CI 依赖此项，否则 `python -m pytest` 找不到 searchforge 包
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]
