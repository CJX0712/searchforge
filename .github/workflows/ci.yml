name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q -W ignore::UserWarning --cov=searchforge --cov-report=term

      - name: Demo smoke (multi-seed benchmark gate)
        run: python examples/run_demo.py

      - name: Secret self-check
        run: |
          # 只匹配"赋值形式的凭据"（引号内高熵串），而不是 tokenize/token 这类术语，
          # 否则扫描器会命中自己 README 里写的这条命令本身。
          if git grep -nI -E "(sk-[A-Za-z0-9]{20,}|(api[_-]?key|secret|password|access[_-]?token)[[:space:]]*[=:][[:space:]]*['\"][A-Za-z0-9_/+-]{16,}['\"])" -- '*.py' '*.md'; then
            echo "::error::potential secret found"
            exit 1
          fi
          echo "no secrets found"
