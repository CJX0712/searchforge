name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q -W ignore::UserWarning --cov=searchforge --cov-report=term

      - name: Demo smoke (multi-seed benchmark gate)
        run: python examples/run_demo.py

      - name: Secret self-check
        run: |
          if git grep -nI -E "(sk-|api[_-]?key|token|secret|password)" -- '*.py' '*.md'; then
            echo "::error::potential secret found"
            exit 1
          fi
          echo "no secrets found"
